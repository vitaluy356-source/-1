<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мандавошка — настройка игры</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.setup{
    width:100%;
    max-width:430px;

    background:#1d1d1d;

    border:1px solid #333;
    border-radius:18px;

    padding:28px 22px 24px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.55);
}

.title{
    text-align:center;

    font-size:30px;
    font-weight:900;

    letter-spacing:1px;

    margin-bottom:5px;
}

.subtitle{
    text-align:center;

    color:#999;

    font-size:13px;

    margin-bottom:28px;
}

.section-title{
    font-size:16px;
    font-weight:bold;

    margin-bottom:12px;
}

.colors{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:8px;

    margin-bottom:26px;
}

.color-button{
    border:2px solid transparent;

    border-radius:12px;

    background:#292929;

    color:white;

    min-height:72px;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    transition:.15s;
}

.color-button:active{
    transform:scale(.96);
}

.color-circle{
    width:25px;
    height:25px;

    border-radius:50%;
}

.color-name{
    font-size:11px;
    font-weight:bold;
}

.color-button.selected{
    border-color:#e5a629;

    background:#353535;

    box-shadow:
        0 0 0 1px rgba(229,166,41,.25),
        0 4px 12px rgba(0,0,0,.3);
}

.green{
    background:#36a852;
}

.red{
    background:#e53935;
}

.blue{
    background:#2878d8;
}

.black{
    background:#050505;
    border:1px solid #777;
}

.players{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:9px;

    margin-bottom:27px;
}

.players button{
    min-height:62px;

    border:2px solid transparent;
    border-radius:12px;

    background:#292929;

    color:white;

    cursor:pointer;

    font-size:14px;
    font-weight:bold;

    transition:.15s;
}

.players button:active{
    transform:scale(.97);
}

.players button.selected{
    border-color:#e5a629;

    background:#353535;

    box-shadow:
        0 0 0 1px rgba(229,166,41,.25);
}

.players-number{
    display:block;

    font-size:22px;

    margin-bottom:3px;
}

.players-description{
    color:#aaa;

    font-size:10px;
    font-weight:normal;
}

.start-button{
    width:100%;

    height:50px;

    border:0;
    border-radius:11px;

    background:#e5a629;
    color:#111;

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.35);

    transition:.15s;
}

.start-button:active{
    transform:scale(.98);
}

.back-button{
    width:100%;

    margin-top:10px;

    height:40px;

    border:0;
    border-radius:10px;

    background:#333;
    color:#aaa;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
}

.info{
    text-align:center;

    margin-top:15px;

    color:#777;

    font-size:11px;
}

@media(max-width:360px){

    .setup{
        padding:23px 16px 20px;
    }

    .title{
        font-size:26px;
    }

    .color-button{
        min-height:66px;
    }

    .color-name{
        font-size:10px;
    }

}

</style>
</head>

<body>

<div class="setup">

    <div class="title">
        МАНДАВОШКА
    </div>

    <div class="subtitle">
        Настройка новой партии
    </div>


    <div class="section-title">
        Выберите свой цвет
    </div>

    <div class="colors">

        <button
            class="color-button selected"
            data-color="green"
            onclick="selectColor('green')">

            <span class="color-circle green"></span>

            <span class="color-name">
                Зелёный
            </span>

        </button>


        <button
            class="color-button"
            data-color="red"
            onclick="selectColor('red')">

            <span class="color-circle red"></span>

            <span class="color-name">
                Красный
            </span>

        </button>


        <button
            class="color-button"
            data-color="blue"
            onclick="selectColor('blue')">

            <span class="color-circle blue"></span>

            <span class="color-name">
                Синий
            </span>

        </button>


        <button
            class="color-button"
            data-color="black"
            onclick="selectColor('black')">

            <span class="color-circle black"></span>

            <span class="color-name">
                Чёрный
            </span>

        </button>

    </div>


    <div class="section-title">
        Количество игроков
    </div>

    <div class="players">

        <button
            class="selected"
            data-players="2"
            onclick="selectPlayers(2)">

            <span class="players-number">
                2
            </span>

            <span class="players-description">
                1 + 1 бот
            </span>

        </button>


        <button
            data-players="3"
            onclick="selectPlayers(3)">

            <span class="players-number">
                3
            </span>

            <span class="players-description">
                1 + 2 бота
            </span>

        </button>


        <button
            data-players="4"
            onclick="selectPlayers(4)">

            <span class="players-number">
                4
            </span>

            <span class="players-description">
                1 + 3 бота
            </span>

        </button>

    </div>


    <button
        class="start-button"
        onclick="startGame()">

        НАЧАТЬ ИГРУ

    </button>


    <button
        class="back-button"
        onclick="goBack()">

        НАЗАД

    </button>


    <div class="info">
        Вы играете выбранным цветом.<br>
        Остальные игроки будут компьютерами.
    </div>

</div>


<script>

let selectedColor = "green";

let selectedPlayers = 2;


function selectColor(color){

    selectedColor = color;

    document
        .querySelectorAll(".color-button")
        .forEach(button => {

            button.classList.remove("selected");

        });

    const selectedButton =
        document.querySelector(
            '.color-button[data-color="' +
            color +
            '"]'
        );

    if(selectedButton){

        selectedButton.classList.add("selected");

    }

}


function selectPlayers(players){

    selectedPlayers = players;

    document
        .querySelectorAll(".players button")
        .forEach(button => {

            button.classList.remove("selected");

        });

    const selectedButton =
        document.querySelector(
            '.players button[data-players="' +
            players +
            '"]'
        );

    if(selectedButton){

        selectedButton.classList.add("selected");

    }

}


function startGame(){

    /*
        Сохраняем настройки партии.

        game.html пока НЕ изменяем.
        На следующем этапе движок будет
        получать эти параметры отсюда.
    */

    localStorage.setItem(
        "mandavoshka_game_settings",
        JSON.stringify({

            humanColor:selectedColor,

            players:selectedPlayers,

            bots:selectedPlayers - 1

        })
    );


    /*
        Запускаем существующий движок.
    */

    window.location.href = "game.html";

}


function goBack(){

    window.location.href = "menu.html";

}

</script>

</body>
</html>
