<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Мандавошка — Меню</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #202020; font-family: Arial, sans-serif; } .menu { width: min(90%, 420px); padding: 40px 25px; text-align: center; } .title { color: white; font-size: 38px; font-weight: bold; margin-bottom: 50px; text-transform: uppercase; } .play-button { width: 100%; padding: 20px; border: none; border-radius: 14px; background: #4caf50; color: white; font-size: 25px; font-weight: bold; cursor: pointer; } 
.play-button,
.rules-button{
    width:100%;

    padding:20px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #4fc35a,
        #2f9e44
    );

    color:white;

    font-size:25px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 16px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.18);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.play-button:active,
.rules-button:active{
    transform:scale(.97);

    box-shadow:
        0 3px 8px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.12);
}

.settings-button{
    width:100%;
    margin-top:14px;

    padding:20px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        135deg,
        #4fc35a,
        #2f9e44
    );

    color:white;

    font-size:25px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 16px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.18);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.settings-button:active{
    transform:scale(.97);

    box-shadow:
        0 3px 8px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.12);
}

.rules-button{
    margin-top:14px;
}
</style> </head> <body> <div class="menu"> <div class="title"> Мандавошка </div> <button class="play-button" onclick="startGame()"> ИГРАТЬ </button><button
    class="rules-button"
    onclick="openRules()"
>
    ПРАВИЛА ИГРЫ
</button>
<button
    class="settings-button"
    onclick="openSettings()"
>
    НАСТРОЙКИ
</button>
 </div> <script> function startGame() { window.location.href = "setup.html"; } 

function openRules(){

    window.location.href="rules.html";

}

function openSettings(){

    window.location.href="settings.html";

}

</script> </body> </html>
