<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Шеш-Беш: Битва четырёх</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{

            margin:0;
            padding:0;

            width:100%;
            height:100%;

            background:#111;

            color:#fff;

            font-family:
                Arial,
                sans-serif;

        }

        body{

            display:flex;

            align-items:center;

            justify-content:center;

            padding:20px;

        }

        .offline-box{

            width:100%;
            max-width:420px;

            padding:32px 24px;

            text-align:center;

            border-radius:18px;

            background:
                linear-gradient(
                    145deg,
                    #242424,
                    #151515
                );

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.55);

            border:
                1px solid
                rgba(255,255,255,.1);

        }

        .icon{

            font-size:52px;

            margin-bottom:18px;

        }

        h1{

            margin:0 0 12px;

            font-size:24px;

        }

        p{

            margin:0 0 24px;

            color:#cfcfcf;

            line-height:1.5;

            font-size:16px;

        }

        button{

            width:100%;

            padding:14px 20px;

            border:0;

            border-radius:12px;

            background:#d9a441;

            color:#111;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

        }

        button:active{

            transform:scale(.98);

        }

    </style>

</head>

<body>

    <div class="offline-box">

        <div class="icon">
            📡
        </div>

        <h1>
            Нет подключения к интернету
        </h1>

        <p>
            Соединение временно недоступно.
            Проверьте подключение и попробуйте снова.
        </p>

        <button
            type="button"
            onclick="location.reload()"
        >
            Повторить подключение
        </button>

    </div>

</body>

</html>
